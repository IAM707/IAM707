<svg xmlns="http://www.w3.org/2000/svg" width="960" height="120" viewBox="0 0 960 120" role="img" aria-label="Keep building, keep learning. Abdulrahman Banafea."><title>Keep building, keep learning. Abdulrahman Banafea.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091420"/><stop offset=".6" stop-color="#142735"/><stop offset="1" stop-color="#0B131D"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#75E6B3"/><stop offset=".6" stop-color="#74C8E7"/><stop offset="1" stop-color="#A69DF5"/></linearGradient><radialGradient id="aura"><stop stop-color="#56C6A7" stop-opacity=".35"/><stop offset="1" stop-color="#56C6A7" stop-opacity="0"/></radialGradient><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#527580" stroke-width=".45" opacity=".32"/></pattern></defs><style>.blink{animation:cursor 1.1s steps(1,end) infinite}.float{animation:float 6s ease-in-out infinite}.dash{animation:dash 10s linear infinite}@keyframes cursor{50%{opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes dash{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.blink,.float,.dash{animation:none}}</style>
<rect x="0" y="0" width="960" height="120" rx="18" fill="url(#bg)" stroke="#435961" stroke-width="1"/><rect x="0" y="0" width="960" height="4" rx="2" fill="url(#accent)"/>
<text x="27" y="56" fill="#F1F8F4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="750" -0.6>Build thoughtfully. Test deliberately. Keep learning.</text>
<text x="28" y="88" fill="#8DB8B5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">ABDULRAHMAN BANAFEA  /  JEDDAH  /  2026</text>
<text x="857" y="81" fill="#83E6C0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="33" font-weight="710" >&lt;/&gt;</text>
