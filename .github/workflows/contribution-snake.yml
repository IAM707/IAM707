# Adapted from Platane/snk's official GitHub Actions example.
name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#33B890&color_dots=#ebedf0,#c9f7df,#89e9ba,#49c99a,#087e61
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#43D3A6&color_dots=#161b22,#123b32,#1c6954,#31a480,#8ce6bc

      - name: Publish assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
