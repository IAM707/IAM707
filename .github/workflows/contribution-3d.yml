# Adapted from yoshi389111/github-profile-3d-contrib's official usage.
name: 3D Contribution Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "12 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-3d.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate real contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh contribution city"
            git push origin HEAD:main
          fi
